# =====================================================================
#  NetGuard Monitor — конфігурація SNMP-опитування
#
#  Джерело істини для Polling Service: ЯК опитувати обладнання.
#  Файл монтується в контейнер Polling Service як /etc/netguard/snmp_config.yaml.
#  Під час старту сервісу та після зміни файлу (нова контрольна сума SHA-256)
#  вміст перевіряється й в одній транзакції застосовується до БД:
#    version      -> snmp_config.format_version (+ увесь файл у snmp_config.content)
#    credentials  -> snmp_credential
#    profiles     -> equipment_type (snmp_profile, name, category, vendor, snmp_mib)
#    profiles.*.metrics -> snmp_oid_map (OID і множник для кожної метрики типу)
#    devices      -> equipment (credential_id, config_id, snmp_port, poll_interval_s)
#
#  Секрети у файлі не зберігаються: ${ІМ'Я} — посилання на змінну середовища
#  контейнера; у БД потрапляє лише ім'я змінної (snmp_credential.secret_ref).
# =====================================================================
version: 1

# Значення за замовчуванням для всіх пристроїв (можна перевизначити в devices)
defaults:
  port: 161                    # equipment.snmp_port
  poll_interval_s: 60          # equipment.poll_interval_s (FR-04: не рідше ніж раз на 60 с)
  timeout_ms: 2000
  retries: 2
  offline_after_failures: 3    # SR-04.2: після 3 невдалих опитувань — статус offline

# Облікові дані SNMP -> snmp_credential
credentials:
  ups-v3:                      # картки APC NMC Symmetra PX підтримують SNMP v1/v3
    version: v3
    username: netguard-poller
    auth_protocol: SHA256
    priv_protocol: AES
    secret: ${SNMP_UPS_V3_SECRET}
  net-v2c:                     # комутатори та маршрутизатори вузлів
    version: v2c
    secret: ${SNMP_NET_COMMUNITY}

# Профілі (шаблони опитування за типом обладнання) -> equipment_type + snmp_oid_map
# Ключі metrics — коди з довідника metric; value = сире значення OID × scale
profiles:
  apc-symmetra-px:
    name: ДБЖ APC Symmetra PX
    category: ups
    vendor: APC
    mib: PowerNet-MIB
    metrics:
      battery_charge:      { oid: 1.3.6.1.4.1.318.1.1.1.2.2.1.0 }               # upsAdvBatteryCapacity, %
      battery_temperature: { oid: 1.3.6.1.4.1.318.1.1.1.2.2.2.0 }               # upsAdvBatteryTemperature, °C
      battery_runtime:     { oid: 1.3.6.1.4.1.318.1.1.1.2.2.3.0, scale: 0.01 }  # TimeTicks (1/100 с) -> с
      battery_voltage:     { oid: 1.3.6.1.4.1.318.1.1.1.2.2.8.0 }               # upsAdvBatteryActualVoltage, В
      input_voltage:       { oid: 1.3.6.1.4.1.318.1.1.1.3.2.1.0 }               # upsAdvInputLineVoltage, В
      output_voltage:      { oid: 1.3.6.1.4.1.318.1.1.1.4.2.1.0 }               # upsAdvOutputVoltage, В
      output_load:         { oid: 1.3.6.1.4.1.318.1.1.1.4.2.3.0 }               # upsAdvOutputLoad, %

  cisco-catalyst:
    name: Комутатор Cisco Catalyst
    category: switch
    vendor: Cisco
    mib: SNMPv2-MIB, CISCO-PROCESS-MIB, CISCO-ENVMON-MIB
    metrics:
      uptime:      { oid: 1.3.6.1.2.1.1.3.0, scale: 0.01 }                      # sysUpTime, TimeTicks -> с
      cpu_load:    { oid: 1.3.6.1.4.1.9.9.109.1.1.1.1.8.1 }                     # cpmCPUTotal5minRev, %
      temperature: { oid: 1.3.6.1.4.1.9.9.13.1.3.1.3.1 }                        # ciscoEnvMonTemperatureStatusValue, °C

# Пристрої -> equipment (зіставлення за name; location — назва з таблиці locations)
devices:
  - name: UPS-DC-01
    ip: 10.0.0.10
    location: ЦОД
    profile: apc-symmetra-px
    credential: ups-v3
  - name: UPS-OBL-01
    ip: 10.1.0.10
    location: Вузол Оболонь
    profile: apc-symmetra-px
    credential: ups-v3
  - name: SW-DC-CORE-01
    ip: 10.0.0.2
    location: ЦОД
    profile: cisco-catalyst
    credential: net-v2c
    poll_interval_s: 30        # перевизначення значення за замовчуванням
  - name: SW-OBL-01
    ip: 10.1.0.2
    location: Вузол Оболонь
    profile: cisco-catalyst
    credential: net-v2c
